<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MINION</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <script>
    // Pre-paint theme so we don't flash light → dark on first render.
    (function () {
      var saved = localStorage.getItem('theme');
      var sys = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', saved || (sys ? 'dark' : 'light'));
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <h1>MINION</h1>
      <span class="tag">research · image gen · dashboard</span>
    </div>
    <div class="controls">
      <button id="new-convo" type="button" class="icon-btn" title="Start a new conversation (clears context)">+ New</button>
      <a class="dash-link" href="/dashboard" target="_blank" rel="noopener">Dashboard ↗</a>
      <label class="toggle">
        <input type="checkbox" id="reasoning-toggle" />
        <span>Show reasoning</span>
      </label>
      <button id="theme-toggle" type="button" class="icon-btn" aria-label="Toggle theme" title="Toggle light / dark">🌓</button>
    </div>
  </header>

  <main class="layout">
    <section class="chat" id="chat" aria-live="polite"></section>

    <aside class="reasoning hidden" id="reasoning">
      <div class="reasoning-head">
        <h2>Reasoning chain</h2>
        <button id="clear-reasoning" type="button">clear</button>
      </div>
      <div class="reasoning-body" id="reasoning-body"></div>
    </aside>
  </main>

  <form class="composer" id="composer" autocomplete="off">
    <button type="button" id="image-toggle" class="icon-btn"
            aria-pressed="false"
            title="Generate an image (one-shot)">🖼</button>
    <input
      id="question"
      name="question"
      type="text"
      placeholder="Ask anything — or type /image to render an image"
      required
    />
    <button id="send" type="submit">Send</button>
  </form>

  <footer class="status" id="status">Idle.</footer>

  <script src="/static/app.js"></script>
</body>
</html>

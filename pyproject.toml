[project]
name = "mini-perplexity"
version = "0.1.0"
description = "S03 agentic AI assignment — a mini Perplexity that searches, reads, cites"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=0.3.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "ddgs>=9.0.0",
    "trafilatura>=1.12.0",
    "requests>=2.31.0",
    "anthropic>=0.40.0",
    "fastmcp>=2.13.0",
    "prefab-ui>=0.5.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[project.scripts]
mini-perplexity = "mini_perplexity:main"
mini-perplexity-web = "webapp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --ignore=_smoke_test.py"
